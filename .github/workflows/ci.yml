name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./mvnw spotless:check
      - run: ./mvnw verify
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm api:check
      - run: pnpm --filter @portfolio/web exec playwright install --with-deps chromium
      - run: pnpm --filter @portfolio/web test:e2e
      - run: pnpm audit --audit-level high
      - uses: actions/dependency-review-action@v5
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
      - run: docker compose -f infra/compose.local.yaml config --quiet
      - run: docker build -f infra/docker/backend.Dockerfile .
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
