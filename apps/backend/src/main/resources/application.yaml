spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: portfolio-engine
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/portfolio?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${SPRING_DATASOURCE_USERNAME:portfolio_app}
    password: ${SPRING_DATASOURCE_PASSWORD:change-local-app-password}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
  jackson:
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false

portfolio:
  runtime-mode: ${PORTFOLIO_RUNTIME_MODE:api}
  strategy-version: ${PORTFOLIO_STRATEGY_VERSION:1.0.0-draft}
  providers:
    mode: ${PORTFOLIO_PROVIDER_MODE:disabled}
  security:
    dev-user: ${PORTFOLIO_SECURITY_DEV_USER:admin@example.local}
    dev-password: ${PORTFOLIO_SECURITY_DEV_PASSWORD:change-before-use}
