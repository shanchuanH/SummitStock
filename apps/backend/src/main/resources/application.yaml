spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: portfolio-engine
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/portfolio?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${SPRING_DATASOURCE_USERNAME:portfolio_app}
    password: ${SPRING_DATASOURCE_PASSWORD:change-local-app-password}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
  jackson:
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false

portfolio:
  runtime-mode: ${PORTFOLIO_RUNTIME_MODE:api}
  runtime-version: ${PORTFOLIO_RUNTIME_VERSION:0.1.0-local}
  fixture-data: false
  strategy-version: ${PORTFOLIO_STRATEGY_VERSION:3.0.0-draft}
  strategy-config-path: ${PORTFOLIO_STRATEGY_CONFIG:strategy/STRATEGY_CONFIG_V3_DRAFT.yaml}
  allow-draft-strategy: ${PORTFOLIO_ALLOW_DRAFT_STRATEGY:false}
  providers:
    market:
      type: ${PORTFOLIO_MARKET_PROVIDER:disabled}
      base-url: ${PORTFOLIO_MARKET_BASE_URL:https://www.alphavantage.co/query}
      api-key: ${PORTFOLIO_MARKET_API_KEY:}
    fundamentals:
      type: ${PORTFOLIO_FUNDAMENTALS_PROVIDER:sec}
      base-url: ${PORTFOLIO_FUNDAMENTALS_BASE_URL:https://data.sec.gov}
      user-agent: ${SEC_USER_AGENT:}
    estimates:
      type: ${PORTFOLIO_ESTIMATES_PROVIDER:unavailable}
      base-url: ${PORTFOLIO_ESTIMATES_BASE_URL:https://www.alphavantage.co/query}
      api-key: ${PORTFOLIO_ESTIMATES_API_KEY:}
      minimum-interval: ${PORTFOLIO_ESTIMATES_MINIMUM_INTERVAL:1s}
      request-timeout: ${PORTFOLIO_ESTIMATES_REQUEST_TIMEOUT:10s}
      max-attempts: ${PORTFOLIO_ESTIMATES_MAX_ATTEMPTS:3}
      retry-delay: ${PORTFOLIO_ESTIMATES_RETRY_DELAY:1s}
    earnings-calendar:
      type: ${PORTFOLIO_EARNINGS_CALENDAR_PROVIDER:unavailable}
      base-url: ${PORTFOLIO_EARNINGS_CALENDAR_BASE_URL:https://www.alphavantage.co/query}
      api-key: ${PORTFOLIO_EARNINGS_CALENDAR_API_KEY:}
      minimum-interval: ${PORTFOLIO_EARNINGS_CALENDAR_MINIMUM_INTERVAL:1s}
      request-timeout: ${PORTFOLIO_EARNINGS_CALENDAR_REQUEST_TIMEOUT:10s}
      max-attempts: ${PORTFOLIO_EARNINGS_CALENDAR_MAX_ATTEMPTS:3}
      retry-delay: ${PORTFOLIO_EARNINGS_CALENDAR_RETRY_DELAY:1s}
    macro:
      type: ${PORTFOLIO_MACRO_PROVIDER:unavailable}
      base-url: ${PORTFOLIO_MACRO_BASE_URL:https://api.stlouisfed.org/fred}
      api-key: ${PORTFOLIO_MACRO_API_KEY:}
      minimum-interval: ${PORTFOLIO_MACRO_MINIMUM_INTERVAL:1s}
      request-timeout: ${PORTFOLIO_MACRO_REQUEST_TIMEOUT:10s}
      max-attempts: ${PORTFOLIO_MACRO_MAX_ATTEMPTS:3}
      retry-delay: ${PORTFOLIO_MACRO_RETRY_DELAY:1s}
    allow-partial-production: ${ALLOW_PARTIAL_PRODUCTION:false}
    execution:
      max-attempts: ${PORTFOLIO_PROVIDER_MAX_ATTEMPTS:3}
      retry-delay: ${PORTFOLIO_PROVIDER_RETRY_DELAY:1s}
      minimum-interval: ${PORTFOLIO_PROVIDER_MINIMUM_INTERVAL:250ms}
      request-timeout: ${PORTFOLIO_PROVIDER_REQUEST_TIMEOUT:10s}
      connect-timeout: ${PORTFOLIO_PROVIDER_CONNECT_TIMEOUT:5s}
  security:
    dev-user: ${PORTFOLIO_SECURITY_DEV_USER:admin@example.local}
    dev-password: ${PORTFOLIO_SECURITY_DEV_PASSWORD:change-before-use}
